<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Permitir acceso · LifePuff</title>
<link rel="stylesheet" href="../../estilo.css">
</head>
<body>
<main class="caja">
  <div class="marca">LifePuff</div>
  <div id="pantalla"><p class="ayuda">Cargando…</p></div>
</main>

<script type="module">
// La pantalla donde decides si tu asistente de IA puede entrar en tu LifePuff.
//
// Aquí no hay nada secreto: la clave es la publicable, la misma que ya lleva la
// app en el teléfono. Quien decide es Supabase Auth, con la sesión de quien
// esté mirando; esta página solo pregunta y enseña lo que se va a conceder.
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ozaeottpolihdynydnht.supabase.co';
const CLAVE_PUBLICA = 'sb_publishable_imeQhxtGq-DF6vbhQ31jBw_VlfbK0j8';

const supabase = createClient(SUPABASE_URL, CLAVE_PUBLICA);
const pantalla = document.getElementById('pantalla');
const idAutorizacion = new URLSearchParams(location.search).get('authorization_id');

// Al volver de Google hay que caer en esta misma página, con el mismo id.
const ESTA_PAGINA = location.origin + location.pathname +
  '?authorization_id=' + encodeURIComponent(idAutorizacion ?? '');

/** Los permisos de OAuth, dichos como se los dirías a una persona. */
const NOMBRES = {
  openid: 'Saber que eres tú',
  email: 'Ver tu correo',
  profile: 'Ver tu nombre y tu foto',
  phone: 'Ver tu teléfono',
  offline_access: 'Seguir conectado sin volver a pedírtelo',
};

const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pinta = (html) => { pantalla.innerHTML = html; };
const aviso = (texto) => '<p class="error">' + esc(texto) + '</p>';

if (!idAutorizacion) {
  pinta('<h1>Falta información</h1><p class="ayuda">Este enlace tiene que venir desde tu asistente. Vuelve a intentarlo desde ahí.</p>');
} else if (!supabase.auth.oauth) {
  pinta('<h1>No disponible</h1><p class="ayuda">Esta versión de LifePuff todavía no puede mostrar la pantalla de permisos. Inténtalo más tarde.</p>');
} else {
  arranca();
}

async function arranca() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) return pideConsentimiento();
  pideEntrar();
}

// ---------------------------------------------------------------------- entrar
function pideEntrar(error) {
  pinta(`
    <h1>Entra en LifePuff</h1>
    <p class="ayuda">Para decidir qué puede ver tu asistente, antes confirma que eres tú.</p>
    ${error ? aviso(error) : ''}
    <button id="google" class="boton">Continuar con Google</button>
    <div class="separador"><span>o con tu contraseña</span></div>
    <label>Correo<input id="correo" type="email" autocomplete="email" placeholder="tu@correo.com"></label>
    <label>Contraseña<input id="clave" type="password" autocomplete="current-password" placeholder="Tu contraseña"></label>
    <button id="entrar" class="boton secundario">Entrar</button>
  `);

  document.getElementById('google').onclick = async (e) => {
    e.currentTarget.disabled = true;
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: ESTA_PAGINA },
    });
    if (error) pideEntrar(traduce(error.message));
  };

  document.getElementById('entrar').onclick = async (e) => {
    const boton = e.currentTarget;
    boton.disabled = true;
    boton.textContent = 'Entrando…';
    const correo = document.getElementById('correo').value.trim();
    const clave = document.getElementById('clave').value;
    const { error } = await supabase.auth.signInWithPassword({ email: correo, password: clave });
    if (error) return pideEntrar(traduce(error.message));
    pideConsentimiento();
  };
}

// ----------------------------------------------------------- dar o negar permiso
async function pideConsentimiento() {
  pinta('<p class="ayuda">Un momento…</p>');

  let detalles;
  try {
    const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(idAutorizacion);
    if (error) throw error;
    detalles = data;
  } catch (e) {
    return pinta('<h1>No se pudo cargar</h1>' +
      aviso(traduce(e?.message) || 'Vuelve a intentarlo desde tu asistente.'));
  }

  // Si ya le diste permiso antes, no se vuelve a preguntar: se sigue de largo.
  if (detalles && !('authorization_id' in detalles) && detalles.redirect_url) {
    return location.replace(detalles.redirect_url);
  }

  const quien = detalles?.client?.name || 'Un asistente';
  const permisos = String(detalles?.scope ?? '').split(/\s+/).filter(Boolean);
  const { data: { user } } = await supabase.auth.getUser();

  pinta(`
    <h1>${esc(quien)} quiere entrar en tu LifePuff</h1>
    <p class="ayuda">Como ${esc(user?.email ?? 'tú')}. Si no reconoces ese nombre, pulsa «Ahora no».</p>
    <div class="lista">
      ${(permisos.length ? permisos : ['email']).map((p) =>
        '<div class="fila"><span class="tic">✓</span>' + esc(NOMBRES[p] ?? p) + '</div>').join('')}
      <div class="fila"><span class="tic">✓</span>Entrar en tus espacios de LifePuff con tus mismos permisos</div>
    </div>
    <p class="nota">Verá lo mismo que tú y nada más. De la Bóveda recibe los datos, nunca los archivos. Puedes quitarle el acceso cuando quieras desde Ajustes.${
      detalles?.redirect_uri
        ? '<br><br>Al terminar te devolverá a <b>' + esc(detalles.redirect_uri) + '</b>'
        : ''}</p>
    <button id="si" class="boton">Permitir</button>
    <button id="no" class="boton secundario">Ahora no</button>
  `);

  document.getElementById('si').onclick = () => decide(true);
  document.getElementById('no').onclick = () => decide(false);
}

async function decide(permitir) {
  pinta('<p class="ayuda">' + (permitir ? 'Conectando…' : 'Cancelando…') + '</p>');
  try {
    const { data, error } = permitir
      ? await supabase.auth.oauth.approveAuthorization(idAutorizacion)
      : await supabase.auth.oauth.denyAuthorization(idAutorizacion);
    if (error) throw error;
    if (data?.redirect_url) return location.replace(data.redirect_url);
    pinta('<h1>' + (permitir ? 'Listo' : 'Cancelado') +
      '</h1><p class="ayuda">Ya puedes volver a tu asistente y cerrar esta ventana.</p>');
  } catch (e) {
    pinta('<h1>No se pudo completar</h1>' +
      aviso(traduce(e?.message) || 'Inténtalo otra vez desde tu asistente.'));
  }
}

/** Los mensajes de Supabase vienen en inglés y de técnico. Aquí se traducen. */
function traduce(mensaje) {
  const m = String(mensaje ?? '').toLowerCase();
  if (!m) return '';
  if (m.includes('invalid login')) return 'Ese correo o esa contraseña no son correctos.';
  if (m.includes('email not confirmed')) return 'Todavía no has confirmado tu correo. Mira tu bandeja de entrada.';
  if (m.includes('expired')) return 'La solicitud caducó. Vuelve a empezar desde tu asistente.';
  if (m.includes('not found')) return 'Esta solicitud ya no existe. Vuelve a empezar desde tu asistente.';
  if (m.includes('rate limit') || m.includes('too many')) return 'Demasiados intentos seguidos. Espera un minuto.';
  return mensaje;
}
</script>
</body>
</html>
