<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Prueba · LifePuff</title>
<link rel="stylesheet" href="../estilo.css">
</head>
<body>
<main class="caja">
  <div class="marca">LifePuff</div>
  <h1>Página de prueba</h1>
  <p class="ayuda">Aquí termina el camino cuando se prueba el permiso de un
  asistente. Solo enseña lo que le llega en la dirección, para poder leerlo.
  Se puede borrar cuando la prueba esté hecha.</p>
  <div id="salida"></div>
</main>

<script>
// Sin secretos: esto solo pinta lo que ya viene escrito en la barra del navegador.
(function () {
  const p = new URLSearchParams(location.search);
  const salida = document.getElementById('salida');
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  if (![...p.keys()].length) {
    salida.innerHTML = '<p class="nota">No ha llegado nada. Esta página se abre sola al final de la prueba.</p>';
    return;
  }

  const bien = p.has('code');
  salida.innerHTML =
    '<p class="' + (bien ? 'nota' : 'error') + '">' +
      (bien ? 'Llegó el código de autorización. El camino entero funciona.'
            : 'No llegó ningún código. Abajo está lo que sí llegó.') +
    '</p><div class="lista">' +
    [...p.entries()].map(([k, v]) =>
      '<div class="fila"><span class="tic">·</span><b>' + esc(k) + '</b>: ' +
      esc(v.length > 60 ? v.slice(0, 60) + '…' : v) + '</div>').join('') +
    '</div>';
})();
</script>
</body>
</html>
